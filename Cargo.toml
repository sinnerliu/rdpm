[workspace]
resolver = "2"
members = [
    "crates/rdpm_core",
    "crates/rdpm_vault",
    "crates/rdpm_rdp_host",
    "crates/rdpm_session",
    "crates/rdpm_workspace",
    "crates/rdpm_ui",
    "crates/rdpm_app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RDPM Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
zeroize = { version = "1.8", features = ["derive"] }

uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# 内部 crates 依赖
rdpm_core = { path = "crates/rdpm_core" }
rdpm_vault = { path = "crates/rdpm_vault" }
rdpm_rdp_host = { path = "crates/rdpm_rdp_host" }
rdpm_session = { path = "crates/rdpm_session" }
rdpm_workspace = { path = "crates/rdpm_workspace" }
rdpm_ui = { path = "crates/rdpm_ui" }

# Windows 系统 API 绑定
[workspace.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Ole",
]
